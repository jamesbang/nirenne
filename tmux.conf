# nirenne — 專用 tmux 設定（只套用在 agents 管理畫面，不影響其他 tmux）

# 滑鼠：點選切換、滾輪捲動、拖曳選取（放開即透過 OSC 52 複製到 Windows 剪貼簿）
set -g mouse on
set -g set-clipboard on
# 複製時直接寫入系統剪貼簿（WSL: PowerShell Set-Clipboard / macOS: pbcopy / Linux: wl-copy, xclip, xsel），不依賴終端機是否支援 OSC 52
set -s copy-command 'python3 -I "$HOME/.config/agent-manager/agents.py" copy'
# Claude 等 Agent 會接管滑鼠，拖曳原本會被送給 Agent 而無法選取。
# 改成：在 Agent 窗格拖曳一律由 tmux 選取（放開即複製到剪貼簿）；左側清單與手冊／傳話檢視窗照常接收滑鼠
# （檢視窗拖曳捲軸、連點翻頁時不會誤入選取模式；要複製檢視窗的文字可用 Shift／Option + 拖曳）；點按與滾輪仍交給 Agent。
bind -n MouseDrag1Pane if -F -t = "#{||:#{@sidebar},#{@viewer}}" "send-keys -M" "copy-mode -M"
# 連按兩下選取一個詞、連按三下選取一整行（同樣放開即複製）
# 複製後右下角顯示綠色「✅ 已複製 N 行到剪貼簿」約 2 秒（不用彈出視窗：它會攔下按鍵，複製後馬上貼上會遺失）
bind -n DoubleClick1Pane if -F -t = "#{||:#{@sidebar},#{@viewer}}" "send-keys -M" {
  select-pane -t = ; copy-mode -M ; send-keys -X select-word ; run-shell -d 0.3 '' ; send-keys -X copy-pipe-and-cancel
  run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" copied '#{client_name}' ; exit 0"
}
bind -n TripleClick1Pane if -F -t = "#{||:#{@sidebar},#{@viewer}}" "send-keys -M" {
  select-pane -t = ; copy-mode -M ; send-keys -X select-line ; run-shell -d 0.3 '' ; send-keys -X copy-pipe-and-cancel
  run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" copied '#{client_name}' ; exit 0"
}
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \; run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" copied '#{client_name}' ; exit 0"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \; run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" copied '#{client_name}' ; exit 0"

# 開發中曾試過「點擊／Shift+點擊起點 → 捲動 → 點擊終點」的長選取（已移除）；重新載入設定時清掉它留下的選項、綁定與 hook
# （tmux 重新載入不會刪掉設定檔裡已經沒有的綁定，所以改過的綁定在下面明確設回原本的樣子）
set -gu @sel_pending
set -gu @sel_from
set -gu @sel_to
set -gu @sel_y
unbind -q -n S-MouseDown1Pane
unbind -q -T copy-mode S-MouseDown1Pane
unbind -q -T copy-mode-vi S-MouseDown1Pane
set-hook -gu pane-mode-changed
bind -T copy-mode    MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi Escape send-keys -X clear-selection
bind -T copy-mode    C-g    send-keys -X clear-selection
# 在捲動模式中「單純點一下左鍵（放開時且無選取範圍）」就離開並回到底部打字；
# 注意不可綁在 MouseDown1Pane（否則往上捲動後按住左鍵拖曳選取時一按下就會跳回底部），
# 也不可在有選取範圍時取消（否則連按兩下／三下選取時放開滑鼠會取消選取）。
bind -T copy-mode    MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode    MouseUp1Pane   if -F "#{selection_present}" "" "send-keys -X cancel"
bind -T copy-mode-vi MouseUp1Pane   if -F "#{selection_present}" "" "send-keys -X cancel"
# 右鍵原本會跳出 tmux 選單，關掉避免誤觸；貼上請用 Ctrl+V 或 Shift+右鍵（Windows Terminal 原生貼上）
# 左側清單收到右鍵／中鍵事件會卡住（ncurses 解析不完整的滑鼠事件時會一直等待），
# 所以清單上直接忽略；在 Agent 畫面上照舊轉給 Agent
bind -n MouseDown2Pane if -F -t = "#{?@sidebar,0,1}" "send-keys -M"
bind -n MouseUp2Pane   if -F -t = "#{?@sidebar,0,1}" "send-keys -M"
# 右鍵：在左側清單的 Agent 上顯示管理選單（主題、複製回覆、協作、訊息、關閉…，不必先切換過去）。
# 先由 agents.py 找出點到的 Agent（存成 @menu_* 選項），再由 tmux 直接開選單：
# tmux 規定選單要在滑鼠操作當下由 tmux 自己開啟，才能用滑鼠點選項。
# -O：放開右鍵後選單不會關閉，可再用左鍵點選項；按住右鍵拖到選項上放開也能直接選。
# 在 Agent 畫面上照舊轉給 Agent。
bind -n MouseUp3Pane if -F -t = "#{?@sidebar,0,1}" "send-keys -M"
bind -n MouseDown3Pane if -F -t = "#{@sidebar}" {
  run-shell -t = "python3 -I \"\$HOME/.config/agent-manager/agents.py\" rmenu '#{pane_id}' '#{mouse_x}' '#{mouse_y}' ; exit 0"
  if -F "#{@menu_wid}" {
    # display-menu 會等選單關閉才繼續；關閉後清除「選單開著」的標記（清單暫停重畫用，避免選單閃爍）
    display-menu -O -T "#{@menu_title}" -x "#{@menu_x}" -y "#{@menu_y}" \
      "#{@t_go}" s { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu switch '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@t_task}" t { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu topic '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_reply}" c { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu reply '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_collab}" l { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu collab '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_msgs}" m { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu msgs '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_forget}" f { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu forget '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "" \
      "#{@t_leave}" x { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu close '#{@menu_wid}' '#{client_name}' ; exit 0" }
    set -g @menu_open_at 0
  }
} {
  send-keys -M
}

# 左鍵點左側清單 Agent 名稱列最右邊的「⋮」（最右邊 3 欄；前 3 列是標題區，例如 [q 休息]，不算）：開同一份選單。
# 有些終端機設定會把右鍵攔下來開自己的選單（例如部分 iTerm2 設定），這是不靠右鍵的替代方式。
# 其他位置照常交給清單（點選切換 Agent）。
bind -n MouseDown1Pane if -F -t = "#{&&:#{@sidebar},#{&&:#{e|>:#{mouse_y},2},#{e|>=:#{mouse_x},#{e|-:#{pane_width},3}}}}" {
  run-shell -t = "python3 -I \"\$HOME/.config/agent-manager/agents.py\" rmenu '#{pane_id}' '#{mouse_x}' '#{mouse_y}' dots ; exit 0"
  if -F "#{@menu_wid}" {
    # display-menu 會等選單關閉才繼續；關閉後清除「選單開著」的標記（清單暫停重畫用，避免選單閃爍）
    display-menu -O -T "#{@menu_title}" -x "#{@menu_x}" -y "#{@menu_y}" \
      "#{@t_go}" s { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu switch '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@t_task}" t { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu topic '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_reply}" c { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu reply '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_collab}" l { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu collab '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_msgs}" m { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu msgs '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "#{@menu_forget}" f { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu forget '#{@menu_wid}' '#{client_name}' ; exit 0" } \
      "" \
      "#{@t_leave}" x { run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" menu close '#{@menu_wid}' '#{client_name}' ; exit 0" }
    set -g @menu_open_at 0
  } {
    select-pane -t = ; send-keys -M
  }
} {
  select-pane -t = ; send-keys -M
}

# 所有 run-shell 呼叫 agents.py 的指令最後都加 ; exit 0：結束碼不是 0（例如重新安裝時檔案短暫不存在、程式出錯）
# 時 tmux 會在窗格顯示「… returned 1」（捲動模式中還會變成檢視模式）；錯誤訊息走 stderr，結束碼 0 時不會顯示。
# 注意這些指令平常不能輸出到 stdout（tmux 同樣會顯示在窗格上）。
# ---- 鎖住 tmux 原生功能：管理畫面只保留本工具需要的操作，避免誤觸分割、關閉、切換等 ----
# 介面文字（右鍵選單、狀態列）存在 @t_* 選項，由 agents.py 依介面語言設定（冒險手冊按 g 切換）
set -g @t_go "前往"
set -g @t_task "設定標籤"
set -g @t_leave "離隊"
set -g @t_home "首頁"
set -g @t_path "路徑"
set -g @t_branch "分支"
set -g @t_select_mode "選取中：放開即複製 · 拖到最上／最下一行會自動捲動 · q 取消"
set -g @t_scroll "↑ 已往上捲 #{scroll_position} 行（共 #{history_size} 行）· 點一下畫面回到底部"

# 前綴鍵（Ctrl+B）與其後的所有快速鍵全部停用；Ctrl+B 會直接交給 Agent（例如 Claude 的背景執行）
set -g prefix None
set -g prefix2 None
unbind -a -q -T prefix
# tmux 原生的滑鼠選單（右鍵、Alt+右鍵，含不需確認的 Kill）
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n MouseDown3StatusRight
# 點／捲動底部狀態列切換視窗、拖曳分隔線改變清單寬度
unbind -n MouseDown1Status
unbind -n WheelUpStatus
unbind -n WheelDownStatus
unbind -n MouseDrag1Border

set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -s terminal-features[90] "xterm-256color:RGB"
# 同步輸出：tmux 每次重畫（尤其彈出視窗每捲一格就整個重送）都包在「開始／結束」之間，
# 終端機收完整份畫面才一次顯示，捲動時不會出現上下不同步的殘影（Windows Terminal、iTerm2 都支援；不支援的終端機會忽略）。
# tmux 3.2 / 3.3 預設送舊式的 DCS 指令，Windows Terminal 不認得，所以統一改成標準的 DECSET 2026
set -s terminal-features[91] "xterm*:sync"
set -s terminal-overrides[90] 'xterm*:Sync=\E[?2026%?%p1%{1}%-%tl%eh%;'
set -g allow-rename off
setw -g automatic-rename off
set -g base-index 0
# 關閉視窗後自動重新編號，新開的 Agent 一律排在清單最後面（而不是補進空出來的編號）
set -g renumber-windows on

# Windows Terminal 分頁標題
set -g set-titles on
set -g set-titles-string "nirenne · #{?#{@agent_dir},#{@agent_label},#{@t_home}}"

# 底部狀態列：目前 Agent、完整路徑、分支；右邊顯示有幾個 Agent 在等你
set -g status on
set -g status-interval 2
set -g status-style "bg=colour236,fg=colour252"
set -g status-left-length 200
# 最前面：Agent 的版本與模型（例如 Claude Code v2.1.322 · Opus 5.5）；還不知道時顯示 Agent 名稱
set -g status-left "#{?#{@agent_dir},#[bold#,fg=colour117] #{?#{@agent_info},#{@agent_info},#{@agent_name}} #[nobold#,fg=default] #{@t_path} #{?#{@agent_dir_show},#{@agent_dir_show},#{@agent_dir}}   #{@t_branch} #{@agent_branch} ,#[bold] #{@t_home} }"
set -g status-right-length 120
# 右下角提示：剛複製完顯示綠色「✅ 已複製 N 行」；拖曳選取時顯示「選取中」；用滾輪往上捲動時顯示捲了多少行、怎麼回到底部
set -g status-right "#{?@copied_msg,#[bg=colour78#,fg=colour16#,bold] #{@copied_msg} #[default] ,#{?selection_present,#[bg=colour220#,fg=colour16#,bold] #{@t_select_mode} #[default] ,#{?#{&&:#{pane_in_mode},#{!=:#{scroll_position},0}},#[bg=colour31#,fg=colour231#,bold] #{E:@t_scroll} #[default] ,}}}#[fg=colour220,bold]#{@agents_waiting} "
# 滾輪捲動時立即更新右下角的行數（狀態列平常每 2 秒才更新一次）；捲回最底下自動離開捲動模式
bind -n WheelUpPane if -F -t = "#{mouse_any_flag}" "send-keys -M" { if -F -t = "#{pane_in_mode}" "send-keys -M" { copy-mode -e -t = ; refresh-client -S } }
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 5 scroll-up \; refresh-client -S
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 5 scroll-down \; refresh-client -S
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 5 scroll-up \; refresh-client -S
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down \; refresh-client -S
# 點右下角的捲動提示本身也能回到底部（狀態列其他點按仍停用）；拖曳選取中不動作，避免取消選取
bind -n MouseDown1StatusRight if -F "#{&&:#{pane_in_mode},#{?selection_present,0,1}}" "send-keys -X cancel ; refresh-client -S"
setw -g window-status-format ""
setw -g window-status-current-format ""
set -g window-status-separator ""

# 窗格上方標題：Agent 窗格顯示 [專案][Agent] 主題
set -g pane-border-status top
# 只有 Agent 窗格且有標題時才顯示文字，避免邊框出現空缺
set -g pane-border-format "#{?#{&&:#{==:#{pane_id},#{@agent_pane}},#{@agent_label}}, #{@agent_label} ,}"
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour39"
# tmux 3.3 起，只有兩個窗格時預設只把「一半」的分隔線上色（看起來像框線斷掉），關掉讓整條線同色
set -gq pane-border-indicators off

# ---- 統一配色：不依賴各終端機的預設前景／背景色，Windows Terminal、macOS 終端機、iTerm2 看起來一致
# （macOS 內建終端機的預設文字偏灰，選單與說明看起來像不能用）
set -g window-style "fg=colour253,bg=colour234"
set -g window-active-style "fg=colour253,bg=colour234"
# 彈出視窗與右鍵選單（tmux 3.3 / 3.4 以後才有這些選項，舊版忽略）
set -gq popup-style "fg=colour253,bg=colour234"
set -gq popup-border-style "fg=colour81"
set -gq menu-style "fg=colour253,bg=colour236"
set -gq menu-selected-style "fg=colour16,bg=colour81,bold"
set -gq menu-border-style "fg=colour81"
# 訊息列（例如「確定讓 … 離隊？(y/n)」）：tmux 預設用「黃色」，但各終端機的黃色不同（macOS 偏暗），改用固定色碼
set -g message-style "fg=colour16,bg=colour220"
set -g message-command-style "fg=colour16,bg=colour220"

# 視窗大小改變時固定左側清單寬度；Agent 視窗空了自動清理
set-hook -g client-resized 'run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" relayout ; exit 0"'
# 其他視窗要等切換過去才會依新大小縮放（左側清單會被按比例擠窄），切換後也要調回固定寬度
set-hook -g session-window-changed 'run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" relayout ; exit 0"'
set-hook -g pane-exited 'run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" gc ; exit 0"'
set-hook -g after-kill-pane 'run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" gc ; exit 0"'
# 離開（detach 或直接關掉 Windows Terminal）時，閒置中的首頁 shell 清成乾淨的歡迎畫面；
# 在離開時就清，重新進入才不會閃一下。Agent 視窗保留原狀。
set-hook -g client-detached 'run-shell -b "python3 -I \"\$HOME/.config/agent-manager/agents.py\" reset-home ; exit 0"'
